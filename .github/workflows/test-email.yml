name: Test deploy email (SMTP)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-test:
    name: Send test email
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate mail secrets
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          missing=0
          [ -z "$MAIL_USERNAME" ] && { echo "::error::Missing MAIL_USERNAME"; missing=1; }
          [ -z "$MAIL_PASSWORD" ] && { echo "::error::Missing MAIL_PASSWORD"; missing=1; }
          [ -z "$MAIL_TO" ] && { echo "::error::Missing MAIL_TO"; missing=1; }
          exit $missing

      - uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "MIS SMTP test OK — ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: Technoventor MIS CI/CD <${{ secrets.MAIL_USERNAME }}>
          attachments: deploy/cicd/assets/logo.jpg,deploy/cicd/assets/banner.jpg
          convert_markdown: false
          html_body: |
            <!DOCTYPE html>
            <html lang="en"><body style="margin:0;padding:40px 16px;background:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
            <table width="620" align="center" cellpadding="0" cellspacing="0" style="max-width:620px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;">
            <tr><td style="padding:24px 32px;border-bottom:1px solid #f3f4f6;"><img src="cid:logo.jpg" alt="Technoventor" height="40" style="display:block;border:0;height:40px;" /></td></tr>
            <tr><td style="padding:0;line-height:0;"><img src="cid:banner.jpg" alt="Design · Develop · Deploy" width="620" style="display:block;width:100%;border:0;" /></td></tr>
            <tr><td style="padding:32px;"><p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#111827;">SMTP test passed</p>
            <p style="margin:0;color:#4b5563;">Gmail SMTP is configured correctly for <strong>${{ github.repository }}</strong>.</p></td></tr>
            </table></body></html>
