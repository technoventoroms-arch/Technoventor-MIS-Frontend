# Rollback via HTTPS deploy hook (same as LMS rollback-vps.yml)

name: Rollback MIS Frontend on VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA (40 chars) or "previous" for last deploy'
        required: true
        default: previous

env:
  API_DOMAIN: api.makerspaceops.com

jobs:
  rollback:
    name: Rollback Web container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Roll back Web via HTTPS hook
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${{ secrets.DEPLOY_HOOK_SECRET }}" ]; then
            echo "::error::Missing DEPLOY_HOOK_SECRET — run setup-deploy-hook.sh on VPS first"
            exit 1
          fi
          PAYLOAD=$(jq -n \
            --arg service web \
            --arg tag "${{ inputs.image_tag }}" \
            --arg registry_user "$DOCKERHUB_USERNAME" \
            --arg registry_token "$DOCKERHUB_TOKEN" \
            '{service: $service, tag: $tag, registry_user: $registry_user, registry_token: $registry_token}')
          RESPONSE=$(curl -sf -m 300 -X POST "https://${{ env.API_DOMAIN }}/_ci/deploy" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_HOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.ok' >/dev/null
