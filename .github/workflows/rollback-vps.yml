name: Rollback MIS Frontend on VPS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA (40 chars) or "previous" for last deploy'
        required: true
        default: previous

env:
  VPS_DEPLOY_PATH: /opt/makerspaceops/MIS_Backend/deploy

jobs:
  rollback:
    name: Rollback Web container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Roll back Web via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ${{ env.VPS_DEPLOY_PATH }}
            export DOCKERHUB_USERNAME DOCKERHUB_TOKEN
            bash scripts/ci-deploy.sh web "$IMAGE_TAG"
